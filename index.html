<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>던전 탈출 퍼즐 - Phaser</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <main class="app-shell" aria-labelledby="game-title">
      <header class="app-header">
        <p>Phaser 3 Mobile Prototype</p>
        <h1 id="game-title">던전 탈출 퍼즐</h1>
      </header>
      <div id="game-container" aria-label="Phaser 던전 탈출 퍼즐 게임"></div>
      <section class="tips" aria-label="게임 설명">
        <span>🎮 가상 조이스틱 / 방향키 / WASD</span>
        <span>🪨 돌을 스위치로 밀면 출구가 열립니다</span>
        <span>🚪 화면 위쪽 출구로 탈출하세요</span>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
    <script src="src/main.js" defer></script>
  </body>
</html>
